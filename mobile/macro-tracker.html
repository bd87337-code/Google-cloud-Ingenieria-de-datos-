<title>Macro Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Diseño: herramienta de seguimiento para el celular. Neutros fríos con tinte verdoso, un acento azul
   (el mismo azul de las series), cifras grandes en la cara de títulos, tarjetas solo donde agrupan. */
:root {
  --bg: #f1f4f3; --surface: #ffffff; --surface2: #e8edeb; --ink: #121719; --ink2: #3f4a4f; --muted: #5a666b;
  --line: #d9e0de; --accent: #2569c4; --accent-ink: #1c5cab; --on-accent: #ffffff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --warn-bg: #fff4d6; --warn-ink: #6b4500; --info-bg: #e4eefb; --info-ink: #17467f; --good-ink: #006300; --bad-ink: #a12a2a; --bad-bg: #fde7e7;
  --scrim: rgba(10, 16, 18, .45); --shadow: 0 -8px 30px rgba(10, 16, 18, .18);
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-display: 'Bricolage Grotesque', 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1213; --surface: #171c1e; --surface2: #21282b; --ink: #eceeed; --ink2: #b9c2c5; --muted: #93a0a5;
    --line: #2a3236; --accent: #3987e5; --accent-ink: #7db3f2; --on-accent: #07121f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --warn-bg: #3a2f10; --warn-ink: #f0c668; --info-bg: #14283f; --info-ink: #9cc6f5; --good-ink: #4fd04f; --bad-ink: #f19a9a; --bad-bg: #3b1d1d;
    --scrim: rgba(0, 0, 0, .6); --shadow: 0 -8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1213; --surface: #171c1e; --surface2: #21282b; --ink: #eceeed; --ink2: #b9c2c5; --muted: #93a0a5;
  --line: #2a3236; --accent: #3987e5; --accent-ink: #7db3f2; --on-accent: #07121f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --warn-bg: #3a2f10; --warn-ink: #f0c668; --info-bg: #14283f; --info-ink: #9cc6f5; --good-ink: #4fd04f; --bad-ink: #f19a9a; --bad-bg: #3b1d1d;
  --scrim: rgba(0, 0, 0, .6); --shadow: 0 -8px 30px rgba(0, 0, 0, .5); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--font-body); padding-inline: 16px; padding-block: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, p { margin: 0; }
h2 { font: 700 19px/1.2 var(--font-display); letter-spacing: -.01em; }
h3 { font: 600 15px/1.3 var(--font-body); }
small, .small { font-size: 13px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 640px; margin-inline: auto; }

/* ---- estructura ---- */
/* La app de Claude dibuja sus botones ✕ y ⋯ flotando sobre la parte alta de la página: se deja ese hueco libre. */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 52px 6px; max-width: 640px; margin-inline: auto; }
.brand { font: 700 18px/1 var(--font-display); letter-spacing: -.02em; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--s3); }
.sync[data-state="local"]::before { background: var(--s4); }
.sync[data-state="saving"]::before { background: var(--s1); }
main { max-width: 640px; margin-inline: auto; padding-block: 8px 112px; display: flex; flex-direction: column; gap: 14px; min-height: 60vh; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr 1fr 64px 1fr 1fr 1fr; align-items: end; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; color: var(--muted);
  font-size: 11px; font-weight: 500; min-height: 48px; cursor: pointer; border-radius: var(--r-sm); }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent-ink); }
.tab[aria-selected="true"] svg { stroke-width: 2.3; }
.tab-cam { justify-self: center; width: 56px; height: 56px; margin-top: -26px; border-radius: 50%; border: 4px solid var(--surface); background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 14px rgba(10, 16, 18, .35); }
.tab-cam svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tab-cam:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.tab:focus-visible, .btn:focus-visible, .row:focus-visible, .chip:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- bloques ---- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.flat { background: transparent; border: 0; padding: 0; }
.card-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sub { color: var(--muted); font-size: 14px; }
.notice { --n-bg: var(--info-bg); --n-ink: var(--info-ink); border-radius: var(--r-sm); padding: 11px 13px; font-size: 14px; display: flex; gap: 10px;
  align-items: flex-start; background: var(--n-bg); color: var(--n-ink); }
.notice .ni { flex: none; width: 20px; height: 20px; margin-top: 0; display: block; }
.notice .ni svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.notice > span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.notice.warn { --n-bg: var(--warn-bg); --n-ink: var(--warn-ink); }
.notice.bad { --n-bg: var(--bad-bg); --n-ink: var(--bad-ink); }
.notice.good { --n-bg: var(--info-bg); --n-ink: var(--good-ink); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; cursor: pointer; text-align: center; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--bad-ink); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent-ink); }
.btn.block { width: 100%; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 140px; }
.btn-row.tight { flex-wrap: nowrap; gap: 8px; }
.btn-row.tight > .btn { flex: 1 1 0; min-width: 0; padding: 0 6px; }
.btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.big-total { font: 700 34px/1 var(--font-body); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

/* ---- formularios ---- */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 14px; font-weight: 600; color: var(--ink); }
.field .hint { font-size: 13.5px; color: var(--muted); }
input[type="text"], input[type="number"], input[type="date"], input[type="search"], select, textarea {
  width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--bg); padding: 0 12px; font-size: 16px; }
textarea { padding: 10px 12px; min-height: 76px; }
input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 360px) { .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface2); border-radius: var(--r-sm); padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; min-height: 40px; border-radius: 8px; font-weight: 600; color: var(--ink2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(10, 16, 18, .18); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 20px; min-height: 38px; padding: 0 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
details > summary { cursor: pointer; font-weight: 600; min-height: 40px; display: flex; align-items: center; color: var(--ink2); list-style-position: inside; }
/* Safari no aplica display:flex/gap al contenido de <details>: el espacio se da con margen, que funciona en todos. */
details.card { display: block; }
details.card > summary { font: 700 17px/1.3 var(--font-display); color: var(--ink); letter-spacing: -.01em; }
details > :not(summary) { margin-top: 14px; }

/* ---- resumen del día ---- */
.date-bar { display: flex; align-items: center; gap: 8px; }
.date-bar .btn { min-width: 46px; padding: 0; }
.date-label { flex: 1; text-align: center; font: 700 17px/1.2 var(--font-display); position: relative; min-height: 46px; display: flex; flex-direction: column; justify-content: center; }
.date-label input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
.kcal-hero { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.kcal-hero .big { font: 700 44px/1 var(--font-body); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.meter { height: 10px; border-radius: 5px; background: var(--surface2); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 5px; background: var(--accent); min-width: 0; transition: width .25s; }
.macro { display: grid; grid-template-columns: 118px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
.macro .meter { height: 8px; }
.macro b { font-variant-numeric: tabular-nums; font-weight: 600; }
.macro-name { display: flex; align-items: center; gap: 7px; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* ---- listas ---- */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 0; border-top: 1px solid var(--line);
  background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; text-align: left; cursor: pointer; }
.list > .row:first-child { border-top: 0; }
.row .main { min-width: 0; flex: 1; }
.row .name { font-weight: 600; overflow-wrap: anywhere; }
.row .meta { font-size: 13px; color: var(--muted); }
.row .end { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.meal { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.meal-head { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.meal-head h3 { flex: 1; }
.btn.plus { min-width: 40px; width: 40px; padding: 0; font-size: 22px; line-height: 1; border-radius: 50%; color: var(--accent-ink); }
.btn.again { align-self: flex-start; justify-content: flex-start; padding: 0 6px; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--surface2); color: var(--ink2); margin-left: 6px; vertical-align: 1px; }
.tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
.empty { text-align: center; padding: 22px 8px; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }

/* ---- progreso ---- */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; }
.kpi .v { font: 700 24px/1.1 var(--font-body); letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); }
.chart-box { position: relative; height: 240px; }
.chart-box.tall { height: 330px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
th { color: var(--muted); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* ---- sheet / toast ---- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; overscroll-behavior: contain; }
.sheet .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 0; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ink); color: var(--bg);
  padding: 11px 16px; border-radius: 22px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, .3); }
.toast { display: flex; align-items: center; gap: 14px; }
.toast[hidden] { display: none; }
.toast-undo { background: none; border: 0; color: var(--bg); font-weight: 700; text-decoration: underline; min-height: 32px; padding: 0 4px; cursor: pointer; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2s; } .meter > i { transition: none; } }


input[type="date"] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; min-height: 1.2em; }
input[type="date"]::-webkit-datetime-edit { padding: 0; }

/* ---- sensación de app en el teléfono ---- */
html { -webkit-tap-highlight-color: transparent; }
button, .row, [role="button"], summary { touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
::selection { background: var(--accent); color: var(--on-accent); }
input, textarea, select { caret-color: var(--accent); accent-color: var(--accent); }
/* respuesta inmediata al tocar: se siente en el dedo, no al soltarlo */
.btn, .chip, .tab, .tab-cam, .row, .seg button { transition: transform .12s cubic-bezier(.23, 1, .32, 1), background-color .12s; }
.btn:active, .chip:active, .tab:active, .seg button:active { transform: scale(.97); }
.tab-cam:active { transform: scale(.93); }
.row:active { background: var(--surface2); }
.btn[disabled]:active { transform: none; }
.row .end.chev svg { width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; display: block; }
.btn.again svg { width: 16px; height: 16px; }
.btn.plus svg, .date-bar .btn svg { width: 22px; height: 22px; }
/* hojas y avisos: entrada corta, de abajo hacia arriba (no se anima nada que se use decenas de veces al día) */
@keyframes sheet-in { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.scrim { animation: fade-in .18s ease-out; }
.sheet { animation: sheet-in .24s cubic-bezier(.23, 1, .32, 1); }
.toast:not([hidden]) { animation: sheet-in .2s cubic-bezier(.23, 1, .32, 1); }
/* esqueleto de carga */
.skels { display: flex; flex-direction: column; gap: 14px; }
.skel { border-radius: var(--r); background: linear-gradient(100deg, var(--surface) 30%, var(--surface2) 50%, var(--surface) 70%); background-size: 300% 100%; animation: shimmer 1.4s ease-in-out infinite; border: 1px solid var(--line); }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet, .toast:not([hidden]), .skel { animation: none; } .btn, .chip, .tab, .tab-cam, .row, .seg button { transition: none; } }

</style>
<header class="top"><span class="brand">Macro Tracker</span><span class="sync" id="sync" data-state="local" role="status">Cargando…</span></header>
<main id="view" aria-live="polite"></main>
<nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
<div class="toast" id="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== CALC: cálculos puros (sin DOM ni almacenamiento). Port fiel de macro_tracker/calc y services.py ===== */
const KCAL_PER_KG = 7700;
const ACTIVITY_FACTORS = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, very_active: 1.9 };
const CFG = {
  windowDays: 14, minFoodDays: 10, minWeighings: 8, minPerHalf: 3,
  maxStepKcal: 250, noiseFloorKcal: 100, ciHigh: 250, ciMedium: 450,
  maDays: 7, defaultMinValidKcal: 1000, proteinRefBf: 0.20,
};

/* ---------- fechas (ISO AAAA-MM-DD, sin zona horaria) ---------- */
const DAY_MS = 86400000;
function dayNum(iso) { const [y, m, d] = iso.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY_MS; }
function isoOf(n) { return new Date(n * DAY_MS).toISOString().slice(0, 10); }
function addDays(iso, n) { return isoOf(dayNum(iso) + n); }
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function dateRange(startIso, endIso) {
  const out = [];
  for (let n = dayNum(startIso); n <= dayNum(endIso); n++) out.push(isoOf(n));
  return out;
}
function ageOn(birthIso, onIso) {
  const [by, bm, bd] = birthIso.split('-').map(Number), [oy, om, od] = onIso.split('-').map(Number);
  let years = oy - by;
  if (om < bm || (om === bm && od < bd)) years -= 1;
  return years;
}
const isNum = (v) => typeof v === 'number' && Number.isFinite(v);

/* ---------- gasto basal ---------- */
function mifflin(weightKg, heightCm, age, sex) {
  if (!(weightKg > 0) || !(heightCm > 0) || !(age > 0)) throw new Error('peso, estatura y edad deben ser positivos');
  if (sex !== 'M' && sex !== 'F') throw new Error("sexo debe ser 'M' o 'F'");
  return 10 * weightKg + 6.25 * heightCm - 5 * age + (sex === 'M' ? 5 : -161);
}
function checkBf(bf) { if (!(bf >= 3 && bf <= 60)) throw new Error('% de grasa fuera de rango [3, 60]'); }
function katch(weightKg, bf) {
  if (!(weightKg > 0)) throw new Error('peso debe ser positivo');
  checkBf(bf);
  return 370 + 21.6 * weightKg * (1 - bf / 100);
}
function estimateBmr(weightKg, heightCm, age, sex, bf = null, prefer = 'auto') {
  if (bf != null && prefer === 'auto') return { kcal: katch(weightKg, bf), method: 'katch_mcardle' };
  return { kcal: mifflin(weightKg, heightCm, age, sex), method: 'mifflin_st_jeor' };
}

/* ---------- composición corporal ---------- */
function proteinRefWeight(weightKg, bf = null) {
  if (bf == null) return weightKg;
  checkBf(bf);
  return Math.min(weightKg, (weightKg * (1 - bf / 100)) / (1 - CFG.proteinRefBf));
}
function navyBodyFat(sex, heightCm, neckCm, waistCm, hipCm = null) {
  if (sex !== 'M' && sex !== 'F') throw new Error("sexo debe ser 'M' o 'F'");
  if (!(heightCm > 0) || !(neckCm > 0) || !(waistCm > 0)) throw new Error('estatura, cuello y cintura deben ser positivos');
  let density;
  if (sex === 'M') {
    const spread = waistCm - neckCm;
    if (spread <= 0) throw new Error('la cintura debe ser mayor que el cuello');
    density = 1.0324 - 0.19077 * Math.log10(spread) + 0.15456 * Math.log10(heightCm);
  } else {
    if (!(hipCm > 0)) throw new Error('las mujeres requieren la medida de cadera');
    const spread = waistCm + hipCm - neckCm;
    if (spread <= 0) throw new Error('cintura + cadera debe ser mayor que el cuello');

/* ===== STORE: persistencia. Nube (db de Claude, privado por usuario) con respaldo en localStorage ===== */
const KINDS = ['profile', 'days', 'foods', 'targets'];

function makeLocalBackend() {
  const KEY = 'macro-tracker:v1';
  let mem = { profile: {}, days: {}, foods: {}, targets: {} };
  try { const raw = localStorage.getItem(KEY); if (raw) mem = { ...mem, ...JSON.parse(raw) }; } catch (e) { /* sin almacenamiento: solo memoria */ }
  const listeners = {};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { /* ignorar */ } };
  const emit = (kind) => (listeners[kind] || []).forEach((fn) => fn(Object.entries(mem[kind]).map(([id, d]) => ({ id, ...d }))));
  return {
    mode: 'local',
    async init() { return true; },
    subscribe(kind, fn) { (listeners[kind] = listeners[kind] || []).push(fn); setTimeout(() => emit(kind), 0); },
    async put(kind, id, data) { mem[kind][id] = JSON.parse(JSON.stringify(data)); persist(); emit(kind); },
    async remove(kind, id) { delete mem[kind][id]; persist(); emit(kind); },
  };
}

function makeCloudBackend(db, uid) {
  const base = db.collection('data/users/' + uid);
  const app = base.doc('app');
  const ref = (kind, id) => (kind === 'profile' ? base.doc('profile') : app.collection(kind).doc(id));
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  // Una sola escritura a la vez, en orden. La plataforma limita las llamadas por segundo; en paralelo
  // (o en ráfagas largas, como una importación) algunas se rechazaban y quedaba el trabajo a medias.
  let tail = Promise.resolve(), gap = 0;
  const enqueue = (fn) => { const next = tail.catch(() => {}).then(() => attempt(fn)); tail = next; return next; };
  async function attempt(fn) {
    for (let n = 0; ; n++) {
      if (gap) await sleep(gap);
      try { const r = await fn(); gap = Math.floor(gap * 0.7); return r; } catch (e) {
        const code = e && e.code;
        if (!((code === 'resource_exhausted' && n < 6) || (code === 'unavailable' && n < 2))) throw e;
        if (code === 'resource_exhausted') gap = Math.min(1500, gap ? gap * 2 : 200);   // ir más despacio, también para lo que sigue
        await sleep(Math.round(300 * 2 ** n * (0.6 + Math.random() * 0.8)));
      }
    }
  }
  return {
    mode: 'cloud',
    async init() { return true; },
    subscribe(kind, fn, onError) {
      const src = kind === 'profile' ? base.doc('profile') : app.collection(kind);
      if (kind === 'profile') src.onSnapshot((s) => fn(s.exists ? [{ id: 'main', ...s.data() }] : []), onError);
      else src.onSnapshot((s) => fn(s.docs.map((d) => ({ id: d.id, ...d.data() }))), onError);
    },
    put(kind, id, data) { const r = ref(kind, id); const body = JSON.parse(JSON.stringify(data)); return enqueue(() => r.set(body)); },
    remove(kind, id) { const r = ref(kind, id); return enqueue(() => r.delete()); },
  };
}

/** Intenta la nube; si no hay db o identidad, usa el navegador. Devuelve el backend elegido. */
async function openBackend() {
  try {
    if (window.claude && window.claude.use) {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (db && uid) return makeCloudBackend(db, uid);
    }
  } catch (e) { /* cae al respaldo local */ }
  return makeLocalBackend();
}

if (typeof module !== 'undefined') module.exports = { openBackend, makeLocalBackend, makeCloudBackend, KINDS };

function aiErrorNote(e) {
  switch (e && e.code) {
    case 'cancelled': return null;
    case 'not_granted': return 'No diste permiso para que esta página use Claude. Puedes capturar los valores a mano.';
    case 'rate_limited': return 'Demasiadas consultas seguidas o llegaste a tu límite de uso. Intenta más tarde.';
    case 'invalid_json': return 'No pude entender la respuesta. Prueba describiendo con más detalle (cantidades y preparación).';
    case 'image_rejected': return 'No pude usar esa imagen. Prueba con otra foto.';
    case 'images_unavailable': return 'Esta vista no puede enviar fotos.';
    case 'session_expired': return 'Tu sesión expiró; vuelve a abrir la página.';
    default: return 'No pude obtener una estimación ahora. Intenta de nuevo o captura los valores a mano.';
  }
}
/** Pregunta a Claude pidiendo JSON. Cada llamada es deliberada, así que no usa la caché. */
function askAi(prompt, blob, ctl) {
  const o = { modelTier: 'default', cache: false, signal: ctl.signal };
  if (blob) o.images = blob;
  return S.caps.sample.json(prompt, o);
}

/** Selector de foto: cámara o galería, con vista previa. */
function photoPicker() {
  const st = { blob: null, url: null };
  const cam = h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true, 'aria-label': 'Tomar foto' });
  const gal = h('input', { type: 'file', accept: 'image/*', hidden: true, 'aria-label': 'Elegir foto de la galería' });
  const prev = h('div');
  const clear = () => { if (st.url) URL.revokeObjectURL(st.url); st.blob = null; st.url = null; prev.replaceChildren(); cam.value = ''; gal.value = ''; };
  const set = (file) => {
    clear(); if (!file) return;
    st.blob = file; st.url = URL.createObjectURL(file);
    prev.replaceChildren(h('img', { src: st.url, alt: 'Foto seleccionada', style: 'max-width:100%;max-height:220px;border-radius:10px;object-fit:contain;align-self:flex-start' }),
      h('button', { class: 'btn ghost sm', type: 'button', onclick: clear }, 'Quitar foto'));
  };
  cam.addEventListener('change', () => set(cam.files[0])); gal.addEventListener('change', () => set(gal.files[0]));
  const el = h('div', { style: 'display:flex;flex-direction:column;gap:8px' },
    h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: () => cam.click() }, 'Tomar foto'), h('button', { class: 'btn', type: 'button', onclick: () => gal.click() }, 'Elegir de la galería')), cam, gal, prev);
  return { el, clear, set, get blob() { return st.blob; } };
}

const AI_MEAL_PROMPT = (text, hasPhoto) => `COMIDA. Eres un asistente de nutrición. Estima las calorías y macros de lo que comió una persona en México${hasPhoto ? ', usando la foto' : ''}${text ? ' y esta descripción: «' + text + '»' : ''}.
Reglas:
- Separa en renglones por alimento o preparación (máximo 12). Incluye aparte aceites, salsas, tortillas, crema y bebidas si se ven o se mencionan.
- "grams" es el peso total del renglón tal como se comió (gramos o mililitros), no por 100 g.
- Si no se indican cantidades, asume porciones típicas realistas y dilo en "note".
- Si ves un objeto de referencia (plato, tortilla, cuchara, lata, mano), úsalo para estimar el tamaño de las porciones.
- No inventes alimentos que no se mencionen ni se vean.
- "kcal" debe ser coherente con 4×proteína + 4×carbohidratos + 9×grasa.
- "confidence": "alta" si el alimento y la cantidad son claros, "media" si hay supuestos, "baja" si es una conjetura.
Responde SOLO con un objeto JSON: {"items":[{"name": string, "grams": number, "kcal": number, "protein": number, "carbs": number, "fat": number, "confidence": "alta"|"media"|"baja", "note": string}]}`;

const AI_LABEL_PROMPT = () => `ETIQUETA. La imagen muestra la tabla de información nutrimental de un producto (probablemente en español, de México). Lee los valores IMPRESOS; no estimes ni completes los que no veas.
Responde SOLO con un objeto JSON: {"readable": boolean, "name": string|null, "brand": string|null, "basis": "per100g"|"per100ml"|"perServing", "servingG": number|null, "servingLabel": string|null, "kcal": number, "protein": number, "carbs": number, "fat": number, "note": string}
- "basis" es la base de la columna que lees: por 100 g, por 100 ml o por porción. Prefiere la columna por 100 g/ml si existe.
- "servingG": peso de la porción en gramos (o ml) si está impreso.
- "kcal": contenido energético en kcal (si solo ves kJ, divide entre 4.184). "carbs": hidratos de carbono totales. "fat": grasa total (no solo saturada).
- Si la imagen no es una tabla nutrimental legible, responde {"readable": false} con ceros en los números.`;

/** Reutiliza un alimento «ai» con el mismo nombre y valores parecidos, o crea uno nuevo. */
function findOrCreateAiFood(item) {
  const per100 = { kcal: (item.kcal * 100) / item.grams, p: (item.p * 100) / item.grams, c: (item.c * 100) / item.grams, f: (item.f * 100) / item.grams };
  const key = norm(item.name);
  const same = foodList().find((f) => f.source === 'ai' && norm(f.name) === key && Math.abs(f.kcal - per100.kcal) <= 0.1 * Math.max(per100.kcal, 1));
  if (same) return same;
  const food = { id: uid(), name: item.name, brand: null, kcal: per100.kcal, p: per100.p, c: per100.c, f: per100.f, servingG: Math.round(item.grams), servingLabel: '1 porción estimada', source: 'ai', archived: false, createdAt: Date.now() };
  saveFood(food);
  return food;
}

/* ---------- toma rápida: un toque en «Foto», dispara, y la estimación empieza sola ---------- */
function quickPhoto(iso) {
  if (!S.caps.sample) { addFoodSheet(iso); return; }
  if (!S.caps.images) { aiLogSheet(iso); return; }
  const inp = h('input', { type: 'file', accept: 'image/*', capture: 'environment', hidden: true });
  document.body.append(inp);
  inp.addEventListener('change', () => { const f = inp.files[0]; inp.remove(); if (f) aiLogSheet(iso, { photo: f, auto: true }); });
  inp.addEventListener('cancel', () => inp.remove());
  inp.click();   // dentro del gesto del toque: abre la cámara
}

/* ---------- hoja: estimar la comida por foto o texto ---------- */
function aiLogSheet(iso, opts = {}) {
  openSheet('Estimar comida', (body, close) => {
    if (!S.caps.sample) { body.append(notice('warn', 'Esta función necesita Claude y no está disponible en esta vista. Ábrela desde la app de Claude, o agrega el alimento a mano.')); return; }
    const txt = h('textarea', { placeholder: 'Opcional: agrega un detalle. Ej.: con 2 cucharadas de aceite, sin tortilla…', rows: 2 });
    const photo = S.caps.images ? photoPicker() : null;
    const out = h('div', { style: 'display:flex;flex-direction:column;gap:12px' }), msg = h('div');
    let items = [], ctl = null;
    const estBtn = h('button', { class: 'btn block', type: 'button' }, 'Estimar');
    const meal = select(MEALS.map((m) => [m, MEAL_LABEL[m]]), opts.meal || mealByHour());
    const totEl = h('div', { class: 'big-total num' }), macEl = h('div', { class: 'sub num' });
    const upd = () => { const t = sumEntries(items.map((x) => ({ kcal: x.kcal, p: x.p, c: x.c, f: x.f }))); totEl.textContent = '≈ ' + fmt0(t.kcal) + ' kcal'; macEl.textContent = `Proteína ${fmt0(t.p)} g · Carbohidratos ${fmt0(t.c)} g · Grasa ${fmt0(t.f)} g`; };

    const draw = () => {
      out.replaceChildren(); if (!items.length) return;
      upd();
      out.append(h('div', { class: 'card', style: 'background:var(--bg)' }, totEl, macEl,
        h('div', { class: 'grid2', style: 'align-items:end' }, field('Comida', meal),
          h('button', { class: 'btn primary', type: 'button', onclick: () => {
            if (!items.length) return;
            const entries = items.map((it) => { const f = findOrCreateAiFood({ name: it.name, grams: it.grams, kcal: it.kcal, p: it.p, c: it.c, f: it.f });
              return { id: uid(), meal: meal.value, foodId: f.id, name: f.name, brand: null, grams: it.grams, kcal: it.kcal, p: it.p, c: it.c, f: it.f, at: Date.now(), est: true }; });
            saveDay(iso, (d) => { d.entries = (d.entries || []).concat(entries); });
            photo && photo.clear(); close(); toast(`Guardado: ≈ ${fmt0(entries.reduce((s, e) => s + e.kcal, 0))} kcal estimadas`);
          } }, 'Guardar'))),
        notice('warn', 'Es una estimación de IA. Lo que más falla son las porciones y lo que no se ve (aceite, azúcar, salsas), y suele quedarse corta. Si algo no cuadra con lo que comiste, corrige los gramos.'));
      items.forEach((it, idx) => {
        const g = numInput(Math.round(it.grams * 10) / 10, { step: '5', min: 0 }); g.style.maxWidth = '110px'; g.setAttribute('aria-label', 'Gramos de ' + it.name);
        const kc = h('div', { class: 'end num' }, fmt0(it.kcal) + ' kcal');
        g.addEventListener('input', () => { const v = num(g.value); if (v > 0) { const k = v / it.base.grams; Object.assign(it, { grams: v, kcal: it.base.kcal * k, p: it.base.p * k, c: it.base.c * k, f: it.base.f * k }); kc.textContent = fmt0(it.kcal) + ' kcal'; upd(); } });
        out.append(h('div', { class: 'card', style: 'background:var(--bg);gap:8px' },
          h('div', { style: 'display:flex;justify-content:space-between;gap:8px;align-items:flex-start' }, h('div', { class: 'name', style: 'font-weight:600;overflow-wrap:anywhere' }, it.name, h('span', { class: 'tag' + (it.confidence === 'baja' ? ' warn' : '') }, 'confianza ' + it.confidence)),
            h('button', { class: 'btn ghost sm', type: 'button', 'aria-label': 'Quitar ' + it.name, onclick: () => { items.splice(idx, 1); draw(); } }, 'Quitar')),
          it.note ? h('div', { class: 'sub' }, it.note) : null, it.adjusted ? h('div', { class: 'sub' }, 'Ajusté las calorías para que cuadren con los macros.') : null,
          h('div', { style: 'display:flex;gap:12px;align-items:center;justify-content:space-between' }, h('div', { style: 'display:flex;gap:6px;align-items:center' }, g, h('span', { class: 'muted' }, 'g')), kc),
          h('div', { class: 'sub num' }, `P ${fmt1(it.p)} · C ${fmt1(it.c)} · G ${fmt1(it.f)} g`)));
      });
    };

    const run = async () => {
      const text = txt.value.trim(), blob = photo ? photo.blob : null;
      msg.replaceChildren();
      if (!text && !blob) { msg.append(notice('warn', 'Toma una foto o escribe lo que comiste.')); return; }
      ctl = new AbortController(); estBtn.disabled = true; items = []; draw();
      estBtn.replaceChildren(h('span', { class: 'spin' }), ' Estimando…');
      msg.append(h('div', { style: 'display:flex;align-items:center;gap:10px' }, h('span', { class: 'spin' }), h('span', null, blob ? 'Analizando tu foto…' : 'Estimando…'), h('button', { class: 'btn ghost sm', type: 'button', onclick: () => ctl.abort() }, 'Cancelar')));
      try {
        const raw = await askAi(AI_MEAL_PROMPT(text, !!blob), blob, ctl);
        items = normalizeAiItems(raw).map((x) => ({ ...x, base: { grams: x.grams, kcal: x.kcal, p: x.p, c: x.c, f: x.f } }));
        msg.replaceChildren(); if (!items.length) msg.append(notice('warn', 'No pude sacar alimentos de eso. Prueba con una foto más clara o describe lo que comiste.'));
        draw(); if (items.length) estBtn.replaceChildren('Estimar de nuevo');
      } catch (e) { msg.replaceChildren(); const t = aiErrorNote(e); if (t) msg.append(notice('bad', t)); estBtn.replaceChildren('Estimar'); }
      finally { estBtn.disabled = false; }
    };
    estBtn.onclick = run;
    body.append(out, msg, photo ? photo.el : null, field('Detalle (opcional)', txt, 'También puedes dictarlo con el micrófono del teclado.'), estBtn);
    if (opts.photo && photo) photo.set(opts.photo);
    if (opts.auto) setTimeout(run, 0); else setTimeout(() => (photo ? null : txt.focus()), 60);
  });
}

/* ---------- foto de etiqueta nutrimental (dentro del formulario de alimento) ---------- */
function labelReader(fields, setSource, msg) {
  const photo = photoPicker();
  const btn = h('button', { class: 'btn block', type: 'button' }, 'Leer la etiqueta de la foto');
  btn.onclick = async () => {
    if (!photo.blob) { msg.replaceChildren(notice('warn', 'Primero toma o elige una foto de la tabla nutrimental.')); return; }
    const ctl = new AbortController(); btn.disabled = true; btn.replaceChildren(h('span', { class: 'spin' }), ' Leyendo…'); msg.replaceChildren();
    try {
      const raw = await askAi(AI_LABEL_PROMPT(), photo.blob, ctl);
      if (!raw || raw.readable === false) { msg.replaceChildren(notice('warn', 'No pude leer una tabla nutrimental en esa foto. Acércate, evita reflejos y que salga completa.')); return; }
      const r = labelToPer100(raw);
      if (!r.ok) { msg.replaceChildren(notice('bad', r.reason === 'no_serving' ? 'La tabla está por porción y no pude leer cuántos gramos tiene la porción. Escribe los valores a mano.' : r.reason === 'implausible' ? 'Los valores que leí no son plausibles (probablemente leí mal). Captura los valores a mano o toma otra foto.' : 'No pude leer los valores. Toma otra foto o captura a mano.')); return; }
      const rd = (v) => Math.round(v * 10) / 10;
      fields.k.value = rd(r.kcal); fields.p.value = rd(r.p); fields.c.value = rd(r.c); fields.f.value = rd(r.f);
      if (r.servingG && !fields.sg.value) { fields.sg.value = Math.round(r.servingG * 10) / 10; if (r.servingLabel && !fields.sl.value) fields.sl.value = r.servingLabel; }
      if (raw.name && !fields.nm.value.trim()) fields.nm.value = String(raw.name).slice(0, 80);
      if (raw.brand && !fields.br.value.trim()) fields.br.value = String(raw.brand).slice(0, 60);
      setSource('label');
      msg.replaceChildren(notice(r.mismatch ? 'warn' : 'info', r.mismatch ? 'Leí estos valores, pero las calorías no cuadran con los macros: probablemente leí mal algún número. Compáralos con la etiqueta.' : 'Leí estos valores de la foto. Compáralos con la etiqueta antes de guardar: una lectura puede fallar.',
        r.perMl ? ' Ojo: la tabla estaba por 100 ml; los trato como por 100 g (aproximado en líquidos).' : ''));
    } catch (e) { const t = aiErrorNote(e); msg.replaceChildren(t ? notice('bad', t) : null); }
    finally { btn.disabled = false; btn.replaceChildren('Leer la etiqueta de la foto'); }
  };
  return h('div', { class: 'card', style: 'background:var(--bg)' }, h('h3', null, 'Desde la etiqueta'), h('p', { class: 'sub' }, 'Toma una foto de la tabla nutrimental. Lee los números impresos, así que es mucho más exacto que estimar un platillo.'), photo.el, btn);
}

/* ===== VISTA HOY ===== */
const sumEntries = (entries) => entries.reduce((t, e) => ({ kcal: t.kcal + e.kcal, p: t.p + e.p, c: t.c + e.c, f: t.f + e.f }), { kcal: 0, p: 0, c: 0, f: 0 });
const per = (food, grams) => ({ kcal: (food.kcal * grams) / 100, p: (food.p * grams) / 100, c: (food.c * grams) / 100, f: (food.f * grams) / 100 });
function validateFood(f) {
  const errs = [];
  if (!f.name || !f.name.trim()) errs.push('El alimento necesita un nombre.');
  for (const [k, l] of [['kcal', 'Las calorías'], ['p', 'La proteína'], ['c', 'Los carbohidratos'], ['f', 'La grasa']]) if (!isNum(f[k]) || f[k] < 0) errs.push(l + ' deben ser un número igual o mayor que 0.');
  if (isNum(f.kcal) && f.kcal > 900) errs.push('Más de 900 kcal por 100 g no es posible (la grasa pura tiene ≈ 900).');
  if (isNum(f.p) && isNum(f.c) && isNum(f.f) && f.p + f.c + f.f > 100.5) errs.push('Proteína + carbohidratos + grasa suman más de 100 g por cada 100 g.');
  if (f.servingG != null && !(f.servingG > 0)) errs.push('La porción debe ser mayor que 0.');
  return errs;
}
function foodLabel(f) { return h('span', null, f.name, f.brand ? ' (' + f.brand + ')' : '', SOURCE_TAG[f.source] ? h('span', { class: 'tag' + (f.source === 'ai' ? ' warn' : '') }, SOURCE_TAG[f.source]) : null); }
function recentFoods(limit = 12) {
  const seen = new Set(), out = [];
  for (const k of Object.keys(S.days).sort().reverse()) {
    for (const e of (S.days[k].entries || []).slice().reverse()) {
      if (seen.has(e.foodId)) continue; seen.add(e.foodId);
      const f = S.foods[e.foodId]; if (f && !f.archived) out.push(f);
      if (out.length >= limit) return out;
    }
  }
  return out;
}
function searchFoods(query, { exclude, limit = 40 } = {}) {
  const tokens = norm(query).split(' ').filter(Boolean);
  if (!tokens.length) return [];
  const first = norm(query);
  return foodList().filter((f) => !f.archived && f.id !== exclude && tokens.every((t) => norm(f.name + ' ' + (f.brand || '')).includes(t)))
    .sort((a, b) => ((a.source === 'usda') - (b.source === 'usda')) || (norm(b.name).startsWith(first) - norm(a.name).startsWith(first)) || a.name.length - b.name.length || (a.name < b.name ? -1 : 1)).slice(0, limit);   // lo tuyo antes que el catálogo incluido
}

/** La última vez (hasta 7 días atrás) que registraste algo en esa comida. */
function lastMeal(iso, meal) {
  for (let i = 1; i <= 7; i++) {
    const k = addDays(iso, -i), es = ((S.days[k] || {}).entries || []).filter((e) => e.meal === meal);
    if (es.length) return { iso: k, entries: es, kcal: sumEntries(es).kcal };
  }
  return null;
}
function repeatMeal(iso, meal, src) {
  // se recalcula con los valores actuales del alimento (por si lo corregiste); lo estimado por IA conserva su valor
  const copies = src.entries.map((e) => { const f = S.foods[e.foodId]; return { ...e, ...(f && !e.est ? per(f, e.grams) : {}), id: uid(), at: Date.now() }; });
  const ids = new Set(copies.map((e) => e.id));
  saveDay(iso, (d) => { d.entries = (d.entries || []).concat(copies); });
  toast(`Repetido: ${MEAL_LABEL[meal].toLowerCase()} · ${fmt0(sumEntries(copies).kcal)} kcal`, 3000, () => saveDay(iso, (d) => { d.entries = (d.entries || []).filter((e) => !ids.has(e.id)); }));
}

      if (query) results.append(h('button', { class: 'btn ghost block', type: 'button', onclick: () => { close(); openFoodForm(null, { name: query, onSaved: (f) => addFoodSheet(iso, f, mealPreset) }); } }, `+ Crear «${query}» como alimento nuevo`));
    };
    q.addEventListener('input', renderResults); renderResults();

      qty.addEventListener('input', upd);
      const qtyField = field('Cantidad (g)', qty);
      const unitSeg = food.servingG ? segmented([['g', 'Gramos'], ['serv', 'Porciones']], 'g', (v) => { unit = v; qty.value = v === 'g' ? food.servingG : 1; qtyField.querySelector('label').textContent = v === 'g' ? 'Cantidad (g)' : 'Porciones'; upd(); }) : null;
      step2.append(h('div', null, h('h3', null, foodLabel(food)), h('div', { class: 'sub' }, `${fmt0(food.kcal)} kcal por 100 g${food.servingG ? ' · ' + (food.servingLabel || 'porción de ' + fmt0(food.servingG) + ' g') : ''}`)),
        food.source === 'ai' ? notice('warn', 'Estos valores los estimó una IA; no son de una etiqueta. Verifícalos cuando puedas.') : null,
        unitSeg, qtyField, field('Comida', meal), prev,
        h('div', { class: 'btn-row' }, h('button', { class: 'btn', type: 'button', onclick: () => { step2.hidden = true; step1.hidden = false; } }, 'Atrás'),
          h('button', { class: 'btn primary', type: 'button', onclick: () => {
            const g = grams(); if (!(g > 0)) { toast('Escribe una cantidad mayor que 0.'); return; }
            const m = per(food, g);
            const entry = { id: uid(), meal: meal.value, foodId: food.id, name: food.name, brand: food.brand || null, grams: g, kcal: m.kcal, p: m.p, c: m.c, f: m.f, at: Date.now() };
            saveDay(iso, (d) => { d.entries = (d.entries || []).concat(entry); });
            close(); toast(`Agregado: ${food.name}`);
          } }, 'Agregar')));
      upd(); qty.focus();
    }
    if (preset) pick(preset); else setTimeout(() => q.focus(), 50);
  });
}

/* ===== VISTA ALIMENTOS Y RECETAS ===== */
function recipePer100(items, yieldG) {
  let t = { kcal: 0, p: 0, c: 0, f: 0 };
  for (const it of items) { const f = S.foods[it.foodId]; if (!f) continue; const m = per(f, it.grams); t = { kcal: t.kcal + m.kcal, p: t.p + m.p, c: t.c + m.c, f: t.f + m.f }; }
  const k = 100 / yieldG;
  return { kcal: t.kcal * k, p: t.p * k, c: t.c * k, f: t.f * k };
}
function recipeDependsOn(rootId, targetId, seen = new Set()) {
  if (seen.has(rootId)) return false; seen.add(rootId);
  const r = S.foods[rootId]; if (!r || !r.recipe) return false;
  return r.recipe.items.some((i) => i.foodId === targetId || recipeDependsOn(i.foodId, targetId, seen));
}
function recomputeDependents(foodId, seen = new Set()) {
  for (const r of foodList()) {
    if (!r.recipe || seen.has(r.id) || !r.recipe.items.some((i) => i.foodId === foodId)) continue;
    seen.add(r.id);
    const m = recipePer100(r.recipe.items, r.recipe.yieldG), sg = r.recipe.yieldG / r.recipe.servings;
    saveFood({ ...r, kcal: m.kcal, p: m.p, c: m.c, f: m.f, servingG: sg, servingLabel: `1 porción (~${Math.round(sg)} g)` });
    recomputeDependents(r.id, seen);
  }
}

const csvEsc = (v) => { if (v == null) return ''; const s = String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
const toCsv = (cols, rows) => '﻿' + [cols.join(','), ...rows.map((r) => cols.map((c) => csvEsc(r[c])).join(','))].join('\n') + '\n';
const isoTs = (ms) => (ms ? new Date(ms).toISOString().replace(/\.\d+Z$/, '+00:00') : '');

function parseCsv(text) {
  if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some((c) => c !== '')) rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); if (row.some((c) => c !== '')) rows.push(row); }
  if (!rows.length) return { cols: [], rows: [] };
  const cols = rows[0].map((c) => c.trim());
  return { cols, rows: rows.slice(1).map((r) => Object.fromEntries(cols.map((c, i) => [c, (r[i] ?? '').trim()]))) };
}

async function applyImport(plan, mode, onProgress) {
  const ops = [];
  if (mode === 'replace') {
    Object.keys(S.days).forEach((k) => ops.push(() => S.backend.remove('days', k)));
    [...S.storedFoods].forEach((id) => ops.push(() => S.backend.remove('foods', id)));
    S.targets.forEach((t) => ops.push(() => S.backend.remove('targets', t.from)));
    if (S.profile) ops.push(() => S.backend.remove('profile', 'main'));
  }
  const base = mode === 'replace' ? {} : S.days;
  Object.values(plan.foods).filter((f) => !sameAsBuiltin(f)).forEach((f) => ops.push(() => S.backend.put('foods', f.id, f)));   // lo idéntico al catálogo incluido no hace falta guardarlo
  for (const [iso, pt] of Object.entries(plan.dayPatches)) {
    const doc = clone(base[iso] || { date: iso });
    if (pt.body) for (const [k, v] of Object.entries(pt.body)) { if (v == null) delete doc[k]; else doc[k] = v; }
    if (!isNum(doc.bf)) delete doc.bfSource;
    if (pt.entries.length) { const map = new Map((doc.entries || []).map((e) => [e.id, e])); pt.entries.forEach((e) => map.set(e.id, e)); doc.entries = [...map.values()]; }
    if (isNum(pt.water)) doc.water = pt.water;
    if (pt.exercise && pt.exercise.length) { const em = new Map((doc.exercise || []).map((e) => [e.id, e])); pt.exercise.forEach((e) => em.set(e.id, e)); doc.exercise = [...em.values()]; }
    if ('forced' in pt) { if (pt.forced == null) delete doc.forced; else doc.forced = pt.forced; }
    if (!isEmptyDay(doc)) ops.push(() => S.backend.put('days', iso, doc));
  }
  plan.targets.forEach((t) => ops.push(() => S.backend.put('targets', t.from, t)));
  if (plan.profile) ops.push(() => S.backend.put('profile', 'main', plan.profile));
  for (let i = 0; i < ops.length; i++) { await ops[i](); onProgress(i + 1, ops.length); if (i % 15 === 14) await new Promise((r) => setTimeout(r, 60)); }
  return ops.length;
}

async function readUploads(fileList) {
  const files = {};
  for (const f of fileList) {
    if (/\.zip$/i.test(f.name)) {
      if (typeof JSZip === 'undefined') throw new Error('No se pudo cargar el lector de ZIP.');
      const zip = await JSZip.loadAsync(await f.arrayBuffer());
      for (const name of Object.keys(zip.files)) { const m = name.split('/').pop().match(/^(.+)\.csv$/i); if (m && CSV_TABLES.includes(m[1])) files[m[1]] = await zip.files[name].async('string'); }
    } else { const m = f.name.match(/^(.+)\.csv$/i); if (m && CSV_TABLES.includes(m[1])) files[m[1]] = await f.text(); else throw new Error(`«${f.name}» no se reconoce: el nombre debe ser una de estas tablas .csv: ${CSV_TABLES.join(', ')}.`); }
  }
  return files;
}
